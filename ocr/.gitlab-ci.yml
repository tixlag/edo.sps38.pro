# Included by edo.yml@webdevs/ci-templates in the EDO project's commit context.
.ocr-pc:
  tags: [deploy-ocr-pc]
  before_script: []
  after_script: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
      changes:
        - ocr/**/*
  variables:
    GIT_DEPTH: "20"
    GIT_SUBMODULE_STRATEGY: none
    PYTHONUNBUFFERED: "1"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"

ocr-validate:
  extends: .ocr-pc
  stage: .pre
  interruptible: true
  timeout: 10m
  script:
    - bash ocr/scripts/ci_check.sh

ocr-deploy-pc:
  extends: .ocr-pc
  stage: deploy
  needs: [ocr-validate]
  resource_group: edo-ocr-pc
  interruptible: false
  timeout: 30m
  environment:
    name: ocr/pc
    url: http://10.10.5.184:8000/docs
  script:
    - python3 ocr/scripts/deploy_pc.py
