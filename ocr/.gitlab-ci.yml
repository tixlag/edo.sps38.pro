# Include from the authoritative external ci-templates/edo.yml.
# .pre is available without changing the parent pipeline's stages.
ocr-contracts-and-installation:
  image: python:3.12-slim
  stage: .pre
  rules:
    - changes:
        - ocr/**/*
  script:
    - cd ocr
    - python -m pip install -r requirements-test.txt
    - python -m unittest discover -s tests -v
    - python scripts/check_repository.py
