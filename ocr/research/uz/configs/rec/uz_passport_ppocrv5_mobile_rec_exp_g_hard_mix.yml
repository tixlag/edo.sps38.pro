Global:
  model_name: PP-OCRv5_mobile_rec
  debug: false
  use_gpu: true

  epoch_num: 12
  log_smooth_window: 20
  print_batch_step: 20

  save_model_dir: /home/neuro/PycharmProjects/RecognizeUZ/paddleocr/output/ocr/passport_rec_exp_g_hard_mix
  save_epoch_step: 1
  eval_batch_step: [0, 500]
  cal_metric_during_train: true

  # Hard fine-tune from previous best model.
  # Important: path WITHOUT .pdparams suffix.
  pretrained_model: /home/neuro/PycharmProjects/RecognizeUZ/paddleocr/output/ocr/passport_rec_exp_c_latin_low_lr_more_aug/best_model/model
  checkpoints:
  save_inference_dir:

  use_visualdl: false

  infer_img: /home/neuro/PycharmProjects/RecognizeUZ/paddleocr_passport_rec_exp_g_hard_mix

  character_dict_path: /home/neuro/PycharmProjects/createOCRDataset/PaddleOCR_training/PaddleOCR/ppocr/utils/dict/ppocrv5_latin_dict.txt

  # Keep 80 for PP-OCRv5 MultiHead / NRTR compatibility.
  max_text_length: &max_text_length 80

  infer_mode: false
  use_space_char: true
  distributed: true

  save_res_path: /home/neuro/PycharmProjects/RecognizeUZ/paddleocr/output/ocr/passport_rec_exp_g_hard_mix/predicts.txt

  d2s_train_image_shape: [3, 48, 768]

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.000005
    warmup_epoch: 1
  regularizer:
    name: L2
    factor: 0.0001

Architecture:
  model_type: rec
  algorithm: SVTR_LCNet

  Transform:

  Backbone:
    name: PPLCNetV3
    scale: 0.95

  Head:
    name: MultiHead
    head_list:
      - CTCHead:
          Neck:
            name: svtr
            dims: 120
            depth: 2
            hidden_dims: 120
            kernel_size: [1, 3]
            use_guide: true
          Head:
            fc_decay: 0.00001

      - NRTRHead:
          nrtr_dim: 384
          max_text_length: *max_text_length

Loss:
  name: MultiLoss
  loss_config_list:
    - CTCLoss:
    - NRTRLoss:

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: SimpleDataSet
    data_dir: /home/neuro/PycharmProjects/RecognizeUZ/paddleocr_passport_rec_exp_g_hard_mix
    label_file_list:
      - /home/neuro/PycharmProjects/RecognizeUZ/paddleocr_passport_rec_exp_g_hard_mix/rec_gt_train.txt

    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false

      - MultiLabelEncode:
          gtc_encode: NRTRLabelEncode

      - RecResizeImg:
          image_shape: [3, 48, 768]

      - KeepKeys:
          keep_keys:
            - image
            - label_ctc
            - label_gtc
            - length
            - valid_ratio

  loader:
    shuffle: true
    batch_size_per_card: 16
    drop_last: true
    num_workers: 8

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /home/neuro/PycharmProjects/RecognizeUZ/paddleocr_passport_rec_exp_g_hard_mix
    label_file_list:
      # Main monitored validation:
      # original hard examples only, without aug leakage.
      - /home/neuro/PycharmProjects/RecognizeUZ/paddleocr_passport_rec_exp_g_hard_mix/rec_gt_val.txt

    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false

      - MultiLabelEncode:
          gtc_encode: NRTRLabelEncode

      - RecResizeImg:
          image_shape: [3, 48, 768]

      - KeepKeys:
          keep_keys:
            - image
            - label_ctc
            - label_gtc
            - length
            - valid_ratio

  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 16
    num_workers: 4
