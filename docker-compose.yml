services:
  mariadb:
    image: mariadb:11.4
    container_name: edo-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: edo
      MARIADB_USER: edo
      MARIADB_PASSWORD: edo
    ports:
      - "3307:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uedo", "-pedo"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: edo-redis
    restart: unless-stopped
    # Host 6379 is commonly taken by other local projects -> expose 6380.
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data

  # Default local S3-compatible storage (moto mock, Docker Hub friendly).
  s3:
    image: motoserver/moto:latest
    container_name: edo-s3
    restart: unless-stopped
    environment:
      MOTO_S3_DEFAULT_KEY_BUFFER_SIZE: "8388608"
    ports:
      - "5000:5000"

  # Optional prod-like MinIO. Requires registry access to minio/minio
  # (unavailable in some sandboxes) -> enabled only via profile:
  #   docker compose --profile minio up -d
  # Then set S3_ENDPOINT=http://localhost:9000 .
  minio:
    image: minio/minio:latest
    container_name: edo-minio
    restart: unless-stopped
    profiles: ["minio"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  createbucket:
    image: minio/mc:latest
    depends_on:
      - minio
    profiles: ["minio"]
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb local/edo-documents --ignore-existing;
      exit 0;
      "

volumes:
  mariadb-data:
  redis-data:
  minio-data:
