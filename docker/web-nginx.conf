# Статика фронта ЭДО (SPA). /api проксирует nginx хоста напрямую в контейнер API.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Хэшированные ассеты Vite — долгий кэш
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html не кэшируем, чтобы новая версия подхватывалась сразу
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
