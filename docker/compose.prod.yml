# ЭДО в проде. Запускается пайплайном (ci-templates/edo.yml), compose-проект "edo".
# Образы и тег задаёт пайплайн: API_IMAGE, WEB_IMAGE, IMAGE_TAG (короткий sha коммита).
# MariaDB/Redis/RabbitMQ — общие контейнеры ЛК в сети lk_default (mariadb, redis, rabbitmq).
# Наружу — только 127.0.0.1, публикует nginx хоста (edo.sps38.pro).
services:
  api:
    image: ${API_IMAGE:?API_IMAGE не задан}:${IMAGE_TAG:?IMAGE_TAG не задан}
    container_name: edo-api
    restart: unless-stopped
    env_file: /var/www/edo.sps38.pro/.env
    ports:
      - "127.0.0.1:3100:3001"
    # Прод сам на себя по публичному домену не ходит: lk.sps38.pro — сразу в nginx хоста
    extra_hosts:
      - "lk.sps38.pro:10.41.0.2"
    networks:
      lk:
        # ЛК (surveys, chat-server) ходит в ЭДО по http://edo-api:3001
        aliases: [edo-api]
    logging:
      driver: json-file
      options: { max-size: "30m", max-file: "5" }

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE не задан}:${IMAGE_TAG:?IMAGE_TAG не задан}
    container_name: edo-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3101:80"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  lk:
    name: lk_default
    external: true
